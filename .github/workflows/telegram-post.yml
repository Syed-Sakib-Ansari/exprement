name: Auto Post New Movies To Telegram

on:
  push:
    paths:
      - 'movies.json'
    branches:
      - main

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Telegram Auto Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram-poster.js

      - name: Commit & Push Posted History
        run: |
          git config --global user.name "MovieDakhi Bot"
          git config --global user.email "bot@moviedakhi.com"
          git add .posted_movies.json || true
          git commit -m "chore: update posted telegram movies history [skip ci]" || echo "No changes to commit"
          git push